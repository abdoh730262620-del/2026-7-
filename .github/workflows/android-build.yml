name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor with Android Platform
        run: npx cap sync android

      - name: Sync and Configure Android App Name
        run: |
          node -e "
            const fs = require('fs');
            // Extract appName from capacitor.config.ts
            const capConfig = fs.readFileSync('capacitor.config.ts', 'utf8');
            const match = capConfig.match(/appName:\s*['\"`](.*?)['\"`]/);
            const appName = match ? match[1] : 'نظام المبيعات';
            console.log('Extracted App Name:', appName);
            
            // Save app name for subsequent steps
            fs.writeFileSync('app_name.txt', appName);
            
            // Update android/app/src/main/res/values/strings.xml
            const stringsPath = 'android/app/src/main/res/values/strings.xml';
            if (fs.existsSync(stringsPath)) {
              let stringsXml = fs.readFileSync(stringsPath, 'utf8');
              stringsXml = stringsXml.replace(/<string name=\"app_name\">.*?<\/string>/, '<string name=\"app_name\">' + appName + '</string>');
              stringsXml = stringsXml.replace(/<string name=\"title_activity_main\">.*?<\/string>/, '<string name=\"title_activity_main\">' + appName + '</string>');
              fs.writeFileSync(stringsPath, stringsXml);
              console.log('Updated Android strings.xml with app name:', appName);
            } else {
              console.log('strings.xml not found, skipping XML update');
            }
          "

      - name: Set up JDK 21 (Required for modern Android builds)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Generate Gradle Wrapper JAR (Isolated from Android build evaluation)
        run: |
          mkdir temp-gradle-wrapper
          cd temp-gradle-wrapper
          touch settings.gradle
          gradle wrapper --gradle-version 8.14.3
          cp gradle/wrapper/gradle-wrapper.jar ../android/gradle/wrapper/
          cd ..
          rm -rf temp-gradle-wrapper
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename and Prepare APK Artifact
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const appName = fs.existsSync('app_name.txt') ? fs.readFileSync('app_name.txt', 'utf8').trim() : 'نظام_المبيعات';
            const safeAppName = appName.replace(/[\s\/\\?%*:|\"<>\s]+/g, '_');
            const apkDir = 'android/app/build/outputs/apk/debug';
            const srcApk = path.join(apkDir, 'app-debug.apk');
            const destApk = path.join(apkDir, safeAppName + '.apk');
            
            if (fs.existsSync(srcApk)) {
              fs.copyFileSync(srcApk, destApk);
              console.log('Successfully renamed APK to:', destApk);
            } else {
              console.error('Source app-debug.apk was not found!');
              process.exit(1);
            }
          "

      - name: Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sales-system-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
